<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>並び替えマスター</title>
<style>
  :root {
    --paper: #FAFAF7;
    --panel: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #5B6472;
    --line: #E4E1D8;
    --teal: #0F766E;
    --teal-dark: #0B5C55;
    --teal-tint: #E4F3F1;
    --green: #15803D;
    --green-tint: #E7F5EC;
    --rose: #BE123C;
    --rose-tint: #FBE7EB;
    --amber: #B45309;
    --amber-tint: #FDF1DF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .app { width: 100%; max-width: 620px; }
  header { margin-bottom: 20px; }
  h1 { font-family: 'Georgia', serif; font-size: 28px; margin: 4px 0 6px; letter-spacing: -0.01em; }
  .app-desc { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin: 0; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: transparent;
    color: var(--teal-dark);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
  }
  .back-link:hover { text-decoration: underline; }

  /* --- grade select screen --- */
  .grade-list { display: flex; flex-direction: column; gap: 12px; }
  .grade-card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; cursor: pointer; text-align: left;
  }
  .grade-card:hover { border-color: var(--teal); }
  .grade-card .g-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .grade-card .g-sub { font-size: 13px; color: var(--ink-soft); }
  .grade-card .g-arrow { font-size: 20px; color: var(--teal); }

  /* --- program select screen --- */
  .program-list { display: flex; flex-direction: column; gap: 10px; }
  .program-group-header {
    font-size: 12px; font-weight: 800; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 14px 0 -2px; padding-left: 2px;
  }
  .program-group-header:first-child { margin-top: 0; }
  .program-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; text-align: left;
  }
  .program-card:hover { border-color: var(--teal); }
  .program-card .p-label { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .program-card .p-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .program-card .p-check {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--teal-tint); color: var(--teal-dark); font-size: 14px; font-weight: 800;
  }
  .program-card:not(.cleared) .p-check { background: var(--line); color: transparent; }

  /* --- practice screen --- */
  .eyebrow { font-size: 13px; color: var(--teal-dark); font-weight: 700; letter-spacing: 0.02em; }
  .stage-desc { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin: 6px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; }
  .progress-track { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--teal); border-radius: 999px; transition: width 0.35s ease; }
  .progress-count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .mode-switch { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
  .mode-switch button { flex: 1; border: none; background: transparent; padding: 10px 8px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: background 0.15s, color 0.15s; }
  .mode-switch button.active { background: var(--teal); color: #fff; }

  .tile.gloss { display: flex; flex-direction: column; align-items: center; line-height: 1.3; padding: 7px 12px; }
  .tile.gloss .g-en { font-size: 15px; }
  .tile.gloss .g-jp { font-size: 11px; color: var(--teal-dark); opacity: 0.75; }

  .tile-wrap { display: inline-flex; align-items: center; gap: 2px; position: relative; }
  .tile-wrap .tile.placed { touch-action: none; }
  .tile-wrap.dragging { z-index: 30; }
  .tile-wrap.dragging .tile { box-shadow: 0 8px 18px rgba(0,0,0,0.2); opacity: 0.95; }
  .tile-wrap.drop-before .tile { box-shadow: inset 3px 0 0 var(--teal-dark); }
  .tile-wrap.drop-after .tile { box-shadow: inset -3px 0 0 var(--teal-dark); }
  .tile-wrap.drop-swap .tile { outline: 2px dashed var(--teal-dark); outline-offset: 2px; }
  .arrow-btn {
    border: none; background: transparent; color: var(--ink-soft);
    width: 20px; height: 28px; font-size: 16px; font-weight: 700;
    cursor: pointer; border-radius: 6px; padding: 0; line-height: 1;
  }
  .arrow-btn:hover:not(:disabled) { background: var(--line); color: var(--ink); }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; }
  .tile.placed.gloss .g-jp { color: var(--ink-soft); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }

  .natural-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .jp-line { font-size: 19px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; }
  .instruction-line { font-size: 13px; color: var(--teal-dark); background: var(--teal-tint); display: inline-block; padding: 5px 10px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; }

  .tier-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--line); color: var(--ink-soft); }
  .tier-badge.tier-1 { background: var(--teal-tint); color: var(--teal-dark); }
  .tier-badge.tier-2 { background: var(--amber-tint); color: var(--amber); }
  .tier-badge.tier-3 { background: var(--rose-tint); color: var(--rose); }

  .modifier-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .modifier-tags .tag { font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; }

  .answer-zone { min-height: 60px; border: 2px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; margin-bottom: 16px; transition: border-color 0.15s; }
  .answer-zone.filled { border-style: solid; border-color: var(--teal); background: var(--teal-tint); }
  .slot-hint { color: var(--ink-soft); font-size: 13px; align-self: center; }

  .tile { background: var(--teal-tint); border: 1.5px solid var(--teal); color: var(--teal-dark); padding: 9px 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; user-select: none; transition: transform 0.1s, box-shadow 0.1s; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(15,118,110,0.18); }
  .tile.placed { background: #fff; border-color: var(--teal-dark); }

  .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }

  .type-input { width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line); font-family: inherit; margin-bottom: 16px; }
  .type-input:focus { outline: none; border-color: var(--teal); }

  .controls { display: flex; gap: 10px; margin-top: 4px; }
  .btn { border: none; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--teal); color: #fff; flex: 1; }
  .btn-primary:hover:not(:disabled) { background: var(--teal-dark); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--ink-soft); }

  .feedback { margin-top: 18px; padding: 16px 18px; border-radius: 12px; font-size: 15px; line-height: 1.7; }
  .feedback.correct { background: var(--green-tint); color: var(--green); }
  .feedback.incorrect { background: var(--rose-tint); color: var(--rose); }
  .feedback .answer-line { color: var(--ink); font-weight: 700; margin-top: 4px; }
  .feedback .en-line { color: var(--ink-soft); font-weight: 500; margin-top: 8px; font-size: 14px; }
  .feedback-head { font-weight: 700; margin-bottom: 2px; }

  .done-card { text-align: center; padding: 48px 24px; }
  .done-card .big { font-size: 40px; font-weight: 800; color: var(--teal); margin-bottom: 8px; }
  .done-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>並び替えマスター</h1>
    <p class="app-desc" id="headerDesc">中学英語の並び替え問題を、教科書の学習順に極めよう。</p>
  </header>

  <!-- Screen 1: grade select -->
  <div id="screenGrade">
    <div class="grade-list" id="gradeList"></div>
  </div>

  <!-- Screen 2: program select -->
  <div id="screenProgram" style="display:none;">
    <button class="back-link" id="backToGrade">&larr; 学年選択に戻る</button>
    <div class="program-list" id="programList"></div>
  </div>

  <!-- Screen 3: practice -->
  <div id="screenPractice" style="display:none;">
    <button class="back-link" id="backToProgram">&larr; Program選択に戻る</button>

    <div class="eyebrow" id="stageEyebrow"></div>
    <p class="stage-desc" id="stageDesc"></p>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="tier-badge" id="tierBadge"></span>
      <div class="progress-count" id="progressCount">問 1</div>
    </div>

    <div class="mode-switch" id="exerciseSwitch"></div>

    <div class="mode-switch" id="chunkSwitch"></div>

    <div class="mode-switch">
      <button id="modeTapBtn" class="active">タップで並べる</button>
      <button id="modeTypeBtn">タイプで入力</button>
    </div>

    <div class="card" id="mainCard">
      <div class="natural-label" id="promptLabel">もとの文</div>
      <div class="jp-line" id="jpLine"></div>
      <div class="modifier-tags" id="modifierTags"></div>
      <div class="instruction-line" id="instructionLine">↓ 英語と同じ語順に並べ替えよう</div>

      <div id="tapArea">
        <div class="answer-zone" id="answerZone"><span class="slot-hint">ここに単語をタップして並べてね</span></div>
        <div class="pool" id="poolArea"></div>
      </div>

      <div id="typeArea" style="display:none;">
        <input type="text" class="type-input" id="typeInput" placeholder="" autocomplete="off">
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="checkBtn">こたえ合わせ</button>
      </div>

      <div class="feedback" id="feedback" style="display:none;"></div>
    </div>

    <div class="card done-card" id="doneCard" style="display:none;">
      <div class="big" id="doneBig"></div>
      <p id="doneMsg"></p>
      <div class="done-actions">
        <button class="btn btn-primary" id="doneContinueBtn">もっと練習する</button>
        <button class="btn btn-ghost" id="doneNextBtn" style="display:none;">次の項目へ &rarr;</button>
        <button class="btn btn-ghost" id="doneBackBtn">Program選択に戻る</button>
      </div>
    </div>

    <div class="controls" style="margin-top:14px; display:none;" id="nextRow">
      <button class="btn btn-primary" id="nextBtn">次の問題へ &rarr;</button>
    </div>
  </div>
</div>

<script>
// STAGE type "chunk": 日本語チャンクを英語と同じ語順に並べ替える(単語を知らなくても語順感覚を養う)
// STAGE type "word": 実際の英単語タイルを並べ替える
// grade: 1=中1, 2=中2, 3=中3

const grades = [
  { id: 1, name: "中学1年", sub: "Get Ready〜Program9・PowerUp1〜3(41項目)" },
  { id: 2, name: "中学2年", sub: "Program1〜8(26項目)" },
  { id: 3, name: "中学3年", sub: "Program1〜7(19項目)" },
];

const stages = [
  {
    key: "getready", grade: 1, splitLevel: 1,
    label: "Get Ready 6",
    eyebrow: "Get Ready 6 &middot; 英語の語順",
    desc: "日本語の文を、英語と同じ順番(だれが→する→なに)に並べ替えよう。英単語を知らなくても、意味を見ながら並べ替えられるよ。",
    promptLabel: "もとの文",
    typePlaceholder: "並べ替えた文を入力してね",
    questions: [
      { jp: "私はイヌが好きです。", pieces: [{en:"I", jp:"私"}, {en:"like", jp:"好きです"}, {en:"dogs", jp:"イヌが"}], coreSlotIndex: 2, corePool: [{en:"cats", jp:"ネコが"}, {en:"birds", jp:"鳥が"}, {en:"rabbits", jp:"ウサギが"}] },
      { jp: "私は英語を勉強します。", pieces: [{en:"I", jp:"私"}, {en:"study", jp:"勉強します"}, {en:"English", jp:"英語を"}], coreSlotIndex: 2, corePool: [{en:"math", jp:"数学を"}, {en:"science", jp:"理科を"}, {en:"music", jp:"音楽を"}] },
      { jp: "私は本を読みます。", pieces: [{en:"I", jp:"私"}, {en:"read", jp:"読みます"}, {en:"books", jp:"本を"}], coreSlotIndex: 2, corePool: [{en:"comics", jp:"マンガを"}, {en:"magazines", jp:"雑誌を"}] },
      { jp: "私はサッカーができます。", pieces: [{en:"I", jp:"私"}, {en:"can play", jp:"できます"}, {en:"soccer", jp:"サッカーが"}], coreSlotIndex: 2, corePool: [{en:"tennis", jp:"テニスが"}, {en:"baseball", jp:"野球が"}] },
      { jp: "私は毎朝走ります。", pieces: [{en:"I", jp:"私"}, {en:"run", jp:"走ります"}, {en:"every morning", jp:"毎朝"}], coreSlotIndex: 2, corePool: [{en:"every day", jp:"毎日"}, {en:"every weekend", jp:"毎週末"}] },
      { jp: "私はギターを弾きます。", pieces: [{en:"I", jp:"私"}, {en:"play", jp:"弾きます"}, {en:"the guitar", jp:"ギターを"}], coreSlotIndex: 2, corePool: [{en:"the piano", jp:"ピアノを"}, {en:"the drums", jp:"ドラムを"}] },
      { jp: "これは私のペンです。", pieces: [{en:"This", jp:"これ"}, {en:"is", jp:"は"}, {en:"my pen", jp:"私のペン"}], coreSlotIndex: 2, corePool: [{en:"my bag", jp:"私のかばん"}, {en:"my book", jp:"私の本"}] },
      { jp: "私はすしが食べたいです。", pieces: [{en:"I", jp:"私"}, {en:"want to eat", jp:"食べたいです"}, {en:"sushi", jp:"すしが"}], coreSlotIndex: 2, corePool: [{en:"pizza", jp:"ピザが"}, {en:"ramen", jp:"ラーメンが"}] },
    ],
  },
  {
    key: "program1-aff", grade: 1, splitLevel: 1,
    label: "Program 1: 肯定文",
    eyebrow: "Program 1 &middot; be動詞(am / are)",
    desc: "I am ~. / You are ~. の肯定文を並べ替えよう。",
    promptLabel: "日本語の意味",
    typePlaceholder: "英文を入力してね (例: I am a student.)",
    questions: [
      { jp: "あなたは忙しいです。", pieces: [{en:"You", jp:"あなた"}, {en:"are", jp:"は"}, {en:"busy", jp:"忙しい"}], coreSlotIndex: 2, corePool: [{en:"kind", jp:"親切"}, {en:"tall", jp:"背が高い"}, {en:"hungry", jp:"おなかがすいて"}, {en:"tired", jp:"疲れて"}, {en:"happy", jp:"幸せ"}] },
      { jp: "私はここにいます。", pieces: [{en:"I", jp:"私"}, {en:"am", jp:"います"}, {en:"here", jp:"ここに"}], coreSlotIndex: 2, corePool: [{en:"there", jp:"あそこに"}, {en:"at home", jp:"家に"}, {en:"at school", jp:"学校に"}] },
      { jp: "私は学生です。", pieces: [{en:"I", jp:"私"}, {en:"am", jp:"は"}, {en:"a student", jp:"学生"}], coreSlotIndex: 2, corePool: [{en:"a teacher", jp:"先生"}, {en:"a doctor", jp:"医者"}, {en:"a nurse", jp:"看護師"}, {en:"a pilot", jp:"パイロット"}] },
      { jp: "私は日本出身です。", pieces: [{en:"I", jp:"私"}, {en:"am", jp:"は"}, {en:"from Japan", jp:"日本出身"}], coreSlotIndex: 2, corePool: [{en:"from America", jp:"アメリカ出身"}, {en:"from Canada", jp:"カナダ出身"}, {en:"from China", jp:"中国出身"}] },
      { jp: "あなたは私の友達です。", pieces: [{en:"You", jp:"あなた"}, {en:"are", jp:"は"}, {en:"my friend", jp:"私の友達"}], coreSlotIndex: 2, corePool: [{en:"my classmate", jp:"私のクラスメート"}, {en:"our teacher", jp:"私たちの先生"}] },
    ],
  },
  {
    key: "program1-neg", grade: 1, splitLevel: 1,
    label: "Program 1: 否定文",
    eyebrow: "Program 1 &middot; be動詞(am / are)",
    desc: "be動詞の否定文(am not / are not)を並べ替えよう。",
    promptLabel: "日本語の意味",
    typePlaceholder: "英文を入力してね (例: I am a student.)",
    questions: [
      { jp: "あなたは忙しくありません。", pieces: [{en:"You", jp:"あなた"}, {en:"are not", jp:"〜ではありません"}, {en:"busy", jp:"忙しい"}] },
      { jp: "私は学生ではありません。", pieces: [{en:"I", jp:"私"}, {en:"am not", jp:"〜ではありません"}, {en:"a student", jp:"学生"}], coreSlotIndex: 2, corePool: [{en:"a teacher", jp:"先生"}, {en:"a doctor", jp:"医者"}, {en:"a nurse", jp:"看護師"}] },
    ],
  },
  {
    key: "program1-q", grade: 1, splitLevel: 1,
    label: "Program 1: 疑問文",
    eyebrow: "Program 1 &middot; be動詞(am / are)",
    desc: "be動詞の疑問文(Am/Are ~?)を並べ替えよう。",
    promptLabel: "日本語の意味",
    typePlaceholder: "英文を入力してね (例: I am a student.)",
    questions: [
      { jp: "あなたは忙しいですか。", pieces: [{en:"Are", jp:"は?"}, {en:"you", jp:"あなた"}, {en:"busy", jp:"忙しい"}], coreSlotIndex: 2, corePool: [{en:"kind", jp:"親切"}, {en:"tall", jp:"背が高い"}, {en:"hungry", jp:"おなかがすいて"}, {en:"tired", jp:"疲れて"}] },
      { jp: "あなたは学生ですか。", pieces: [{en:"Are", jp:"は?"}, {en:"you", jp:"あなた"}, {en:"a student", jp:"学生"}], coreSlotIndex: 2, corePool: [{en:"a teacher", jp:"先生"}, {en:"a doctor", jp:"医者"}, {en:"a nurse", jp:"看護師"}] },
    ],
  },
  {
    key: "program1-where", grade: 1, splitLevel: 1,
    label: "Program 1: Where疑問文",
    eyebrow: "Program 1 &middot; be動詞(am / are)",
    desc: "Where are you? のような場所をたずねる文を並べ替えよう。",
    promptLabel: "日本語の意味",
    typePlaceholder: "英文を入力してね (例: I am a student.)",
    questions: [
      { jp: "あなたはどこにいますか。", pieces: [{en:"Where", jp:"どこに"}, {en:"are", jp:"います"}, {en:"you", jp:"あなた"}] },
      { jp: "彼らはどこにいますか。", pieces: [{en:"Where", jp:"どこに"}, {en:"are", jp:"います"}, {en:"they", jp:"彼ら"}] },
      { jp: "彼はどこにいますか。", pieces: [{en:"Where", jp:"どこに"}, {en:"is", jp:"います"}, {en:"he", jp:"彼"}] },
    ],
  },
  {
    key: "program2-aff", grade: 1, splitLevel: 1,
    label: "Program 2: 肯定文",
    eyebrow: "Program 2 &middot; 一般動詞・When・命令文・Let's",
    desc: "一般動詞の肯定文を並べ替えよう。",
    promptLabel: "日本語の意味",
    typePlaceholder: "英文を入力してね (例: I play tennis.)",
    questions: [
      { jp: "私はテニスをします。", pieces: [{en:"I", jp:"私"}, {en:"play", jp:"します"}, {en:"tennis", jp:"テニスを"}], coreSlotIndex: 2, corePool: [{en:"soccer", jp:"サッカーを"}, {en:"baseball", jp:"野球を"}, {en:"basketball", jp:"バスケットボールを"}, {en:"the guitar", jp:"ギターを"}, {en:"the piano", jp:"ピアノを"}] },
      { jp: "私たちはサッカーが好きです。", pieces: [{en:"We", jp:"私たち"}, {en:"like", jp:"好きです"}, {en:"soccer", jp:"サッカーが"}], coreSlotIndex: 2, corePool: [{en:"tennis", jp:"テニスが"}, {en:"dogs", jp:"イヌが"}, {en:"cats", jp:"ネコが"}, {en:"music", jp:"音楽が"}] },
    ],
  },
  {
    key: "program2-neg", grade: 1, splitLevel: 1,
    label: "Program 2: 否定文",
    eyebrow: "Program 2 &middot; 一般動詞・When・命令文・Let's",
    desc: "一般動詞の否定文(do not ~)を並べ替えよう。",
    promptLabel: "日本語の意味",

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function splitWords(sentence) {
  return sentence.replace(/[.?]/g, '').trim().split(/\s+/);
}

function currentStage() { return stages[stageIndex]; }

// 各問題を {en, jp} のピース配列に統一する。旧形式(pieces未設定)は英単語のみで代用。
function pieceList(q) {
  if (Array.isArray(q.pieces)) return q.pieces;
  return splitWords(q.en || '').map(w => ({ en: w, jp: '' }));
}

// 単語をグループ化する。maxWords個までのまとまりに分けるが、
// maxWordsが2以上のときは最後に単語1つだけが余らないよう直前のまとまりに合流させる
// (「単語ひとつだけのまとまり」を避けるため)。maxWords=1のときは単語ばらしなので
// そのまま1語ずつに分ける。
function groupWords(words, maxWords) {
  if (maxWords <= 1) return words.map(w => [w]);
  if (words.length <= maxWords) return [words];
  const groups = [];
  let i = 0;
  while (i < words.length) {
    let size = Math.min(maxWords, words.length - i);
    if (words.length - i - size === 1) size += 1; // 最後に1語だけ残さない
    groups.push(words.slice(i, i + size));
    i += size;
  }
  if (groups.length > 1 && groups[groups.length - 1].length === 1) {
    const last = groups.pop();
    groups[groups.length - 1] = groups[groups.length - 1].concat(last);
  }
  return groups;
}

// to/the/a/an のような、それ単体では日本語訳を付けにくい機能語。
// 単語ばらし(小さいまとまり)のときはこれらを意味なし表示にする。
const FUNCTION_WORDS = new Set(['to', 'the', 'a', 'an']);

// chunkLevel: 1=大きいまとまり(分割なし) / 2=ふつう(2語以上のまとまり) / 3=小さいまとまり(単語1つずつ)
// 2語以上のまとまりには、もとのピースと同じ日本語訳を付けるので意味は空欄にならない。
// 単語1つずつに分けたときだけ、to/theなどの機能語は意味なしにする。
function expandPieces(pieces, level) {
  const maxWords = CHUNK_LEVEL_MAX_WORDS[level] || 99;
  const result = [];
  pieces.forEach(p => {
    const words = p.en.split(' ');
    const groups = groupWords(words, maxWords);
    groups.forEach(g => {
      let jp = p.jp;
      if (g.length === 1) {
        const bare = g[0].toLowerCase().replace(/[^a-z]/g, '');
        if (FUNCTION_WORDS.has(bare)) jp = '';
      }
      result.push({ en: g.join(' '), jp });
    });
  });
  return result;
}

function piecesForCurrentMode(q) {
  return expandPieces(pieceList(q), chunkLevel);
}

// pieces内にbe動詞(訳が「は」/「は?」)があるかを調べ、その直後を副詞の挿入位置にする。
// なければ(一般動詞など)動詞の前、つまり主語の直後(index 1)に挿入する。
function adverbInsertIndex(pieces) {
  const beIdx = pieces.findIndex(p => p.jp === 'は' || p.jp === 'は?');
  return beIdx >= 0 ? beIdx + 1 : Math.min(1, pieces.length);
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ベースの文に修飾語を合成する。副詞は動詞の前後に挿入、時・場所の句は文末に追加する。
function applyModifiers(basePieces, mods) {
  let pieces = basePieces.map(p => ({ ...p }));
  const jpTags = [];
  mods.forEach(mod => {
    if (mod.type === 'adverb') {
      pieces.splice(adverbInsertIndex(pieces), 0, { en: mod.en, jp: mod.jp });
    } else {
      pieces.push({ en: mod.en, jp: mod.jp });
    }
    jpTags.push(mod.jp);
  });
  return { pieces, jpTags };
}

// ベースの文の中身(名詞・形容詞など)をランダムに入れ替える。coreSlotIndex/corePoolが
// 設定されている問題だけ対象。もとの語も候補に含め、入れ替えたときは表示用の日本語文
// (jp)の該当部分も置き換える。
function applyCoreSlot(base, pieces) {
  if (base.coreSlotIndex == null || !base.corePool) {
    return { pieces, jp: base.jp };
  }
  const original = pieces[base.coreSlotIndex];
  const candidates = [original, ...base.corePool];
  const chosen = pickRandom(candidates);
  if (chosen === original) {
    return { pieces, jp: base.jp };
  }
  const newPieces = pieces.map(p => ({ ...p }));
  newPieces[base.coreSlotIndex] = { en: chosen.en, jp: chosen.jp };
  const newJp = original.jp && base.jp.includes(original.jp)
    ? base.jp.replace(original.jp, chosen.jp)
    : base.jp;
  return { pieces: newPieces, jp: newJp };
}

// セッション内でn問目(0始まり)に出す問題を組み立てる。ベースの例文をローテーションしつつ、
// tier1(最初の3問)=そのまま / tier2(次の3問)=修飾語を1つ追加 / tier3(それ以降)=2つ組み合わせる。
// coreSlotが設定されている問題は、tierに関係なく中身の単語もランダムに入れ替える。
// 2つの異なる時・場所の句をランダムに選ぶ(同じものが重ならないように)
function pickTwoTimePlace() {
  const a = pickRandom(TIME_PLACE_MODIFIERS);
  let b = pickRandom(TIME_PLACE_MODIFIERS);
  while (b === a && TIME_PLACE_MODIFIERS.length > 1) b = pickRandom(TIME_PLACE_MODIFIERS);
  return [a, b];
}

// セッション内でn問目(0始まり)に出す問題を組み立てる。ベースの例文をローテーションしつつ、
// tier1(最初の3問)=そのまま / tier2(次の3問)=修飾語を1つ追加 / tier3(それ以降)=2つ組み合わせる。
// coreSlotが設定されている問題は、tierに関係なく中身の単語もランダムに入れ替える。
// s.noAdverbが立っている単元(命令文・Let's文・if節・I wishなど、副詞を文中に挟むと
// 不自然になるもの)は、副詞を使わず時・場所の句だけで修飾する。
function getSessionQuestion(s, n) {
  const idx = sessionOrder[n % sessionOrder.length];
  const base = s.questions[idx];
  const { pieces: corePieces, jp: coreJp } = applyCoreSlot(base, pieceList(base));
  const tier = n < 3 ? 1 : n < 6 ? 2 : 3;
  let mods = [];
  if (tier === 2) {
    if (s.noAdverb) {
      mods = [{ ...pickRandom(TIME_PLACE_MODIFIERS), type: 'timeplace' }];
    } else {
      mods = Math.random() < 0.5
        ? [{ ...pickRandom(ADVERB_MODIFIERS), type: 'adverb' }]
        : [{ ...pickRandom(TIME_PLACE_MODIFIERS), type: 'timeplace' }];
    }
  } else if (tier === 3) {
    if (s.noAdverb) {
      const [a, b] = pickTwoTimePlace();
      mods = [{ ...a, type: 'timeplace' }, { ...b, type: 'timeplace' }];
    } else {
      mods = [
        { ...pickRandom(ADVERB_MODIFIERS), type: 'adverb' },
        { ...pickRandom(TIME_PLACE_MODIFIERS), type: 'timeplace' },
      ];
    }
  }
  const { pieces, jpTags } = applyModifiers(corePieces, mods);
  return { jp: coreJp, pieces, tier, jpTags };
}

function availableExerciseModes(s) {
  return ['glossed', 'enonly'];

let dragState = null; // { idx, pointerId, wrapEl, startX, startY, moved, targetEl }

function clearDragVisuals() {
  answerZone.querySelectorAll('.tile-wrap').forEach(w => {
    w.classList.remove('dragging', 'drop-before', 'drop-after', 'drop-swap');
    w.style.transform = '';
  });
}

function attachDragHandlers(wrap, tile, idx) {
  tile.addEventListener('pointerdown', (e) => {
    if (answered) return;
    dragState = { idx, pointerId: e.pointerId, wrapEl: wrap, startX: e.clientX, startY: e.clientY, moved: false, targetEl: null, dropMode: 'swap' };
    try { tile.setPointerCapture(e.pointerId); } catch (_) {}
    wrap.classList.add('dragging');
  });

  tile.addEventListener('pointermove', (e) => {
    if (!dragState || dragState.pointerId !== e.pointerId) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) dragState.moved = true;
    if (!dragState.moved) return;
    dragState.wrapEl.style.transform = `translate(${dx}px, ${dy}px)`;

    let hoverEl = null;
    let dropMode = 'swap';
    answerZone.querySelectorAll('.tile-wrap').forEach(w => {
      w.classList.remove('drop-before', 'drop-after', 'drop-swap');
      if (w === dragState.wrapEl) return;
      const r = w.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        hoverEl = w;
        const relX = (e.clientX - r.left) / r.width;
        // 端の25%ずつ=間に挿入、中央50%=入れ替え
        if (relX < 0.25) dropMode = 'before';
        else if (relX > 0.75) dropMode = 'after';
        else dropMode = 'swap';
      }
    });
    if (hoverEl) hoverEl.classList.add(dropMode === 'before' ? 'drop-before' : dropMode === 'after' ? 'drop-after' : 'drop-swap');
    dragState.targetEl = hoverEl;
    dragState.dropMode = dropMode;
  });

  function finishDrag(e) {
    if (!dragState || dragState.pointerId !== e.pointerId) return;
    const { idx: fromIdx, moved, targetEl, dropMode } = dragState;
    clearDragVisuals();
    if (!moved) {
      // ただのタップ → プールに戻す(従来通り)
      if (!answered) {
        const piece = placedPieces.splice(fromIdx, 1)[0];
        poolPieces.push(piece);
        renderTiles();
      }
      dragState = null;
      return;
    }
    if (targetEl) {
      const hoverIdx = Number(targetEl.dataset.idx);
      if (dropMode === 'swap') {
        [placedPieces[fromIdx], placedPieces[hoverIdx]] = [placedPieces[hoverIdx], placedPieces[fromIdx]];
      } else {
        const piece = placedPieces.splice(fromIdx, 1)[0];
        const adjustedHoverIdx = hoverIdx > fromIdx ? hoverIdx - 1 : hoverIdx;
        const insertPos = dropMode === 'after' ? adjustedHoverIdx + 1 : adjustedHoverIdx;
        placedPieces.splice(insertPos, 0, piece);
      }
    }
    dragState = null;
    renderTiles();
  }

  tile.addEventListener('pointerup', finishDrag);
  tile.addEventListener('pointercancel', finishDrag);
}

function renderTiles() {
  const isGloss = exerciseMode === 'glossed';
  answerZone.innerHTML = '';
  answerZone.classList.toggle('filled', placedPieces.length > 0);
  if (placedPieces.length === 0) {
    answerZone.innerHTML = '<span class="slot-hint">ここに単語をタップして並べてね</span>';
  } else {
    placedPieces.forEach((piece, idx) => {
      const wrap = document.createElement('span');
      wrap.className = 'tile-wrap';
      wrap.dataset.idx = idx;

      const leftBtn = document.createElement('button');
      leftBtn.className = 'arrow-btn';
      leftBtn.innerHTML = '&#8249;';
      leftBtn.disabled = idx === 0 || answered;
      leftBtn.onclick = (e) => {
        e.stopPropagation();
        if (answered || idx === 0) return;
        [placedPieces[idx - 1], placedPieces[idx]] = [placedPieces[idx], placedPieces[idx - 1]];
        renderTiles();
      };

      const tile = document.createElement('button');
      tile.className = 'tile placed' + (isGloss ? ' gloss' : '');
      tile.innerHTML = tileContent(piece);
      attachDragHandlers(wrap, tile, idx);

      const rightBtn = document.createElement('button');
      rightBtn.className = 'arrow-btn';
      rightBtn.innerHTML = '&#8250;';
      rightBtn.disabled = idx === placedPieces.length - 1 || answered;
      rightBtn.onclick = (e) => {
        e.stopPropagation();
        if (answered || idx === placedPieces.length - 1) return;
        [placedPieces[idx + 1], placedPieces[idx]] = [placedPieces[idx], placedPieces[idx + 1]];
        renderTiles();
      };

      wrap.appendChild(leftBtn);
      wrap.appendChild(tile);
      wrap.appendChild(rightBtn);
      answerZone.appendChild(wrap);
    });
  }

  poolArea.innerHTML = '';
  poolPieces.forEach((piece, idx) => {
    const tile = document.createElement('button');
    tile.className = 'tile' + (isGloss ? ' gloss' : '');
    tile.innerHTML = tileContent(piece);
    tile.onclick = () => {
      if (answered) return;
      poolPieces.splice(idx, 1);
      placedPieces.push(piece);
      renderTiles();
    };
    poolArea.appendChild(tile);
  });
}

function normalize(s) {
  return s.replace(/[。、.,!?\s]/g, '').toLowerCase();
}

function checkAnswer() {
  if (answered) return;
  const s = currentStage();
  const pieces = piecesForCurrentMode(currentQData);
  const field = pieceField();
  let userAnswer;
  if (inputMode === 'tap') {
    userAnswer = placedPieces.map(p => p[field]).join('');
  } else {
    userAnswer = typeInput.value;
  }
  const correctAnswer = pieces.map(p => p[field]).join('');
  const isCorrect = normalize(userAnswer) === normalize(correctAnswer);
  answered = true;
  checkBtn.disabled = true;
  typeInput.disabled = true;

  feedback.style.display = 'block';
  feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
  const correctDisplay = pieces.map(p => p[field]).join(' ');
  if (isCorrect) {
    feedback.innerHTML = `<div class="feedback-head">せいかい!</div>${correctDisplay}`;
  } else {
    feedback.innerHTML = `<div class="feedback-head">おしい!正しい語順は:</div><div class="answer-line">${correctDisplay}</div>`;
  }
  nextRow.style.display = 'flex';
  const milestone = s.questions.length + 6;
  progressFill.style.width = `${Math.min(100, ((sessionCount + 1) / milestone) * 100)}%`;
}

function nextQuestion() {
  const s = currentStage();
  sessionCount++;
  const milestone = s.questions.length + 6;
  if (sessionCount === milestone && !milestoneReached) {
    milestoneReached = true;
    clearedStages.add(s.key);
    showDone();
  } else {
    loadQuestion();
  }
}

function showDone() {
  mainCard.style.display = 'none';
  doneCard.style.display = 'block';
  const s = currentStage();
  const sameGrade = stages.filter(st => st.grade === s.grade);
  const posInGrade = sameGrade.indexOf(s);
  const hasNextInGrade = posInGrade < sameGrade.length - 1;

  doneBig.textContent = 'ひとまずクリア!';
  doneMsg.textContent = `「${s.label}」の基本文・修飾語つき・複合文をひと通り練習しました。まだまだ問題は作れるので、続けても、次に進んでもOKです。`;
  nextRow.style.display = 'none';
  progressFill.style.width = '100%';
  progressCount.textContent = `問 ${sessionCount}`;

  doneContinueBtn.onclick = () => {
    showScreen('practice');
    loadQuestion();
  };
  doneNextBtn.style.display = hasNextInGrade ? 'block' : 'none';
  if (hasNextInGrade) {
    doneNextBtn.onclick = () => {
      stageIndex = stages.indexOf(sameGrade[posInGrade + 1]);
      loadStageMeta();
      loadQuestion();
    };
  }
  doneBackBtn.onclick = () => showScreen('program');
}

function setInputMode(newMode) {
  inputMode = newMode;
  modeTapBtn.classList.toggle('active', inputMode === 'tap');
  modeTypeBtn.classList.toggle('active', inputMode === 'type');
  tapArea.style.display = inputMode === 'tap' ? 'block' : 'none';
  typeArea.style.display = inputMode === 'type' ? 'block' : 'none';
}

checkBtn.addEventListener('click', checkAnswer);
nextBtn.addEventListener('click', nextQuestion);
modeTapBtn.addEventListener('click', () => setInputMode('tap'));
modeTypeBtn.addEventListener('click', () => setInputMode('type'));
typeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !answered) checkAnswer();
});

showScreen('grade');
</script>
</body>
</html>
